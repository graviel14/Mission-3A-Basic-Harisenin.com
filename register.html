<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar — videobelajar</title>
  <meta name="description" content="Buat akun videobelajar dan mulai belajar dari video pilihan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <a class="auth-logo" href="login.html" aria-label="videobelajar"><img src="logo.png" alt="videobelajar" width="194" height="31"></a>

  <main class="auth-card">
    <h1>Pendaftaran Akun</h1>
    <p class="subtitle">Yuk, daftarkan akunmu sekarang juga!</p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Nama Lengkap <span class="req">*</span></label>
        <input class="input" type="text" id="name" name="name" placeholder="Nama lengkap" autocomplete="name" required>
        <div class="error-msg">Nama lengkap wajib diisi.</div>
      </div>

      <div class="field">
        <label for="email">E-Mail <span class="req">*</span></label>
        <input class="input" type="email" id="email" name="email" placeholder="contoh@email.com" autocomplete="email" required>
        <div class="error-msg">Masukkan alamat e-mail yang valid.</div>
      </div>

      <div class="field">
        <label for="phone">No. HP <span class="req">*</span></label>
        <div class="phone-wrap">
          <span class="prefix">+62</span>
          <input class="input" type="tel" id="phone" name="phone" placeholder="81234567890" inputmode="numeric" autocomplete="tel-national" required>
        </div>
        <div class="error-msg">Nomor HP tidak valid (9–13 digit, tanpa angka 0 di depan).</div>
      </div>

      <div class="field">
        <label for="password">Kata Sandi <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="password" name="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" aria-label="Tampilkan kata sandi" data-toggle="password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-msg">Kata sandi minimal 6 karakter.</div>
      </div>

      <div class="field">
        <label for="confirm">Konfirmasi Kata Sandi <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="confirm" name="confirm" placeholder="Ulangi kata sandi" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" aria-label="Tampilkan konfirmasi kata sandi" data-toggle="confirm">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-msg">Konfirmasi kata sandi tidak sama.</div>
      </div>

      <div class="form-row-end"><a class="link" href="#" id="forgot">Lupa Password?</a></div>

      <div class="btn-stack">
        <button type="submit" class="btn btn-green">Daftar</button>
        <a href="login.html" class="btn btn-soft">Masuk</a>
      </div>

      <div class="divider">atau</div>

      <button type="button" class="btn btn-outline" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Daftar dengan Google (SSO)
      </button>
      <div class="form-status" id="status" role="status"></div>
    </form>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
